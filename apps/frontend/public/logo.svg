<svg viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="koda-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f0a47c"/>
      <stop offset="55%" stop-color="#d97757"/>
      <stop offset="100%" stop-color="#a8462a"/>
    </linearGradient>
    <linearGradient id="koda-shine" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="rgba(255,255,255,0.25)"/>
      <stop offset="40%" stop-color="rgba(255,255,255,0)"/>
    </linearGradient>
    <filter id="koda-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="1" stdDeviation="0.6" flood-color="#000" flood-opacity="0.25"/>
    </filter>
  </defs>
  <rect width="64" height="64" rx="15" fill="url(#koda-bg)"/>
  <rect width="64" height="64" rx="15" fill="url(#koda-shine)"/>
  <rect x="0.75" y="0.75" width="62.5" height="62.5" rx="14.25"
        fill="none" stroke="rgba(255,255,255,0.15)" stroke-width="1"/>
  <g filter="url(#koda-shadow)">
    <path d="M22 14 L22 50" stroke="#fff" stroke-width="5.5" stroke-linecap="round"/>
    <path d="M22 32 L41 14" stroke="#fff" stroke-width="5.5" stroke-linecap="round"/>
    <path d="M22 32 L43 50" stroke="#fff" stroke-width="5.5" stroke-linecap="round"/>
    <circle cx="22" cy="32" r="2.6" fill="#fff"/>
  </g>
</svg>
