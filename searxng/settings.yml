use_default_settings: true

general:
  debug: false
  instance_name: "Koda Search"

search:
  safe_search: 0
  autocomplete: ""
  formats:
    - html
    - json

server:
  secret_key: "koda_searxng_secret_change_me"
  bind_address: "0.0.0.0:8080"
  base_url: false
  image_proxy: false

ui:
  static_use_hash: true

enabled_plugins:
  - Hash_plugin
  - Search_on_category_select
  - Vim-like_hotkeys
